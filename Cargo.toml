[package]
name = "rusty-book-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "app"
path = "src/bin/app.rs"

[workspace]
members = ["api", "kernel", "adapter", "shared", "registry"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
adapter = { path = "./adapter" }
api = { path = "./api" }
kernel = { path = "./kernel" }
shared = { path = "./shared" }
registry = { path = "./registry" }
async-trait = "0.1.92"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
derive-new = "0.7.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
secrecy = "0.10.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "uuid", "chrono", "macros", "postgres", "migrate"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
mockall = "0.15.0"
redis = { version = "1.7.1", features = ["tokio-rustls-comp"] }
bcrypt = "0.19.3"
itertools = "0.15.0"
tower = "0.5.3"
tracing = { version = "0.1.44", features = ["log"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio-stream = "0.1.19"
garde = { version = "0.23.0", features = ["derive", "email"] }

[dependencies]
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
adapter.workspace = true
api.workspace = true
registry.workspace = true
shared.workspace = true
anyhow.workspace = true
axum.workspace = true
utoipa.workspace = true
utoipa-redoc = { version = "7.0.0", features = ["axum"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
opentelemetry = "0.33.0"
tracing-opentelemetry = "0.34.0"
opentelemetry-jaeger = { version = "0.22.0", features = ["rt-tokio"] }
log = "0.4.34"

[profile.dev.package.sqlx-macros]
opt-level = 3